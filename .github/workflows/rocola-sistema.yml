# EL SISTEMA OPERATIVO DE LA ROCOLA (Rocola OS), COMPILADO POR GITHUB (peticion del dueno del 1-11-2026: soporte continuo). En cada cambio
# del sistema (sistema/, menos el programa, que tiene su propio flujo) compila con Buildroot la imagen del A4 entera (sh sistema/compila.sh)
# y publica la version «sistema-N» con:
#   sistema.img.gz, bzImage, initrd.gz + sha256.txt   lo que baja la rocola instalada para actualizarse (rocola-actualiza)
#   disk.img.gz + disk.img.gz.sha256                  la imagen para la memoria USB (el instalador): ya no hace falta compilar en casa
# Antes de publicar, prueba que el nucleo arranca (en QEMU, hasta el primer programa: el resto lleva instrucciones del Piledriver que QEMU
# no tiene). Las descargas y ccache se guardan entre compilaciones (la primera tarda horas; las siguientes, mucho menos).
name: Sistema de la rocola (Rocola OS)

# SOLO A PEDIDO (decision del dueno del 6-11-2026, al acabarse los 2 000 minutos de Actions del mes: cada compilacion del sistema tarda
# cerca de una hora). Se lanza desde GitHub: Actions -> «Sistema de la rocola (Rocola OS)» -> Run workflow (o se le pide a Claude).
# El programa de la rocola (rocola-programa.yml, unos 3 minutos) sigue compilandose solo en cada cambio.
# RAPIDA O COMPLETA (peticion del dueno del 7-11-2026: que sean mas rapidas): si desde la ultima compilacion COMPLETA solo cambiaron
# scripts del sistema (rootfs_overlay), el arranque del sistema instalado (initramfs/init), el menu de la memoria (grub-bios.cfg) o el
# programa, se hace la rapida (sistema/rapida.sh: la ultima completa con eso encima, unos minutos); si cambio otra cosa (la configuracion
# de Buildroot, el nucleo, los paquetes, post-build.sh...), la completa (unos 35 min). «completa» la fuerza.
on:
  workflow_dispatch:
    inputs:
      completa:
        description: 'Compilar el sistema entero aunque baste la rapida'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rocola-sistema
  cancel-in-progress: false

jobs:
  # LA BASE (la ultima version completa) Y QUE COMPILACION HACE FALTA. Cada version dice en version.txt de que commit es; las rapidas,
  # ademas, sobre que completa se hicieron («rapida base=sistema-N SHA»).
  decidir:
    runs-on: ubuntu-24.04
    outputs:
      modo: ${{ steps.d.outputs.modo }}
      base_tag: ${{ steps.d.outputs.base_tag }}
      base_sha: ${{ steps.d.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          modo=completa; base_tag=; base_sha=
          ult=$(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^sistema-[0-9]+$' | sort -t- -k2 -n | tail -1)
          if [ -n "$ult" ] && gh release download "$ult" -p version.txt -D /tmp/v; then
            cat /tmp/v/version.txt
            if grep -q ' base=' /tmp/v/version.txt; then
              base_tag=$(sed -n 's/.* base=\([^ ]*\) \([0-9a-f]*\).*/\1/p' /tmp/v/version.txt)
              base_sha=$(sed -n 's/.* base=\([^ ]*\) \([0-9a-f]*\).*/\2/p' /tmp/v/version.txt)
            else
              base_tag=$ult; base_sha=$(awk '{print $3}' /tmp/v/version.txt)
            fi
            [ -n "$base_sha" ] && modo=$(bash sistema/rapida.sh decide "$base_sha")
          fi
          [ "${{ inputs.completa }}" = true ] && modo=completa
          echo "Compilacion: $modo (base: $base_tag $base_sha)"
          echo "modo=$modo" >> "$GITHUB_OUTPUT"; echo "base_tag=$base_tag" >> "$GITHUB_OUTPUT"; echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

  # LA RAPIDA: la ultima completa con los cambios de ahora encima (sistema/rapida.sh), la misma prueba de arranque y los mismos archivos.
  rapida:
    needs: decidir
    if: needs.decidir.outputs.modo == 'rapida'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ROCOLA_SISTEMA_VERSION: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q cpio rsync clang zlib1g-dev qemu-system-x86 e2fsprogs
      - name: Bajar la base (${{ needs.decidir.outputs.base_tag }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.decidir.outputs.base_tag }}" -p sistema.img.gz -p disk.img.gz -p bzImage -p initrd.gz -D base
      - name: Poner los cambios encima
        run: bash sistema/rapida.sh arma "${{ needs.decidir.outputs.base_sha }}" base pub
      - name: Probar que el nucleo arranca
        run: |
          timeout 600 qemu-system-x86_64 -m 1024 -kernel pub/bzImage -append "console=ttyS0 root=PARTUUID=524f4341-01 rootwait panic=-1" \
            -drive file=pub/disk.img,format=raw,if=ide,snapshot=on -display none -serial file:serie.txt -no-reboot || true
          tail -n 20 serie.txt
          grep -q "Run /sbin/init" serie.txt
          rm -f pub/disk.img
      - name: Publicar la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ github.run_number }}
          echo "sistema $V ${GITHUB_SHA} rapida base=${{ needs.decidir.outputs.base_tag }} ${{ needs.decidir.outputs.base_sha }}" > pub/version.txt
          { git log -1 --pretty='%s'; echo; echo "(compilacion rapida sobre ${{ needs.decidir.outputs.base_tag }})"; } > notas.txt
          gh release create "sistema-$V" pub/* --target "$GITHUB_SHA" --title "Sistema de la rocola $V" --notes-file notas.txt

  compilar:
    needs: decidir
    if: needs.decidir.outputs.modo == 'completa'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ROCOLA_TRABAJO: /home/runner/rocola-trabajo
      ROCOLA_SISTEMA_VERSION: ${{ github.run_number }}
    steps:
      - name: Hacer sitio en el disco (Buildroot ocupa unos 16 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          mkdir -p /home/runner/rocola-trabajo
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential cpio rsync bc unzip file clang zlib1g-dev qemu-system-x86 python3
      - name: Descargas y ccache de la vez anterior
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/rocola-trabajo/descargas
            /home/runner/rocola-trabajo/ccache
          key: rocola-sistema-${{ hashFiles('sistema/configs/rocola_a4_defconfig') }}-${{ github.run_number }}
          restore-keys: |
            rocola-sistema-${{ hashFiles('sistema/configs/rocola_a4_defconfig') }}-
            rocola-sistema-
      - name: Compilar Rocola OS (la imagen del A4)
        run: sh sistema/compila.sh
      - name: Probar que el nucleo arranca
        run: |
          I=/home/runner/rocola-trabajo/salida/images
          timeout 600 qemu-system-x86_64 -m 1024 -kernel $I/bzImage -append "console=ttyS0 root=PARTUUID=524f4341-01 rootwait panic=-1" \
            -drive file=$I/disk.img,format=raw,if=ide,snapshot=on -display none -serial file:serie.txt -no-reboot || true
          tail -n 20 serie.txt
          grep -q "Run /sbin/init" serie.txt
      - name: Publicar la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ github.run_number }}
          I=/home/runner/rocola-trabajo/salida/images; T=/home/runner/rocola-trabajo/salida/target
          mkdir -p pub
          gzip -9c $I/rootfs.ext2 > pub/sistema.img.gz
          cp $I/bzImage pub/bzImage
          cp $T/usr/share/rocola/instalar/initrd.gz pub/initrd.gz
          (cd pub && sha256sum sistema.img.gz bzImage initrd.gz > sha256.txt)
          gzip -9c $I/disk.img > pub/disk.img.gz
          (cd pub && sha256sum disk.img.gz > disk.img.gz.sha256)
          echo "sistema $V ${GITHUB_SHA}" > pub/version.txt
          git log -1 --pretty='%s' > notas.txt
          gh release create "sistema-$V" pub/* --target "$GITHUB_SHA" --title "Sistema de la rocola $V" --notes-file notas.txt

  # LA MEMORIA PARA PROBAR EN CUALQUIER PC (3-11-2026; el dueno quiere probarla en su PC con Ryzen y RTX 4070): la misma rocola sin las
  # instrucciones del Piledriver, con la pantalla de la UEFI (sirve con NVIDIA), dibujo por el procesador (llvmpipe), NVMe y sonido USB
  # (ROCOLA_PERFIL=pc, sistema/compila.sh). Solo prueba: su menu no tiene el instalador y rocola-instalar se niega. Se compila despues de
  # la del A4 (que no la espera para publicarse) y se anade a la misma version como disk-pc.img.gz.
  # APAGADA (4-11-2026, el dueno: «cancela las compilaciones para mi PC»): no cabia en el tope de 6 h de GitHub. Para volver a
  # encenderla, quitar el «if: false».
  compilar-pc:
    if: false
    needs: compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ROCOLA_TRABAJO: /home/runner/rocola-trabajo
      ROCOLA_SISTEMA_VERSION: ${{ github.run_number }}
      ROCOLA_PERFIL: pc
    steps:
      - name: Hacer sitio en el disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          mkdir -p /home/runner/rocola-trabajo
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Herramientas
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential cpio rsync bc unzip file clang zlib1g-dev qemu-system-x86 python3 cmake ninja-build
      # Restaurar y guardar por separado: con actions/cache, si el trabajo se corta (el tope de GitHub son 6 h y la primera compilacion,
      # con el LLVM, se paso) no se guardaba nada y el siguiente intento empezaba de cero. Asi se guarda siempre y el siguiente sigue.
      - name: Descargas y ccache de la vez anterior (las del PC)
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/rocola-trabajo/descargas
            /home/runner/rocola-trabajo/ccache
          key: rocola-sistema-pc-${{ hashFiles('sistema/configs/rocola_a4_defconfig') }}-${{ github.run_number }}
          restore-keys: |
            rocola-sistema-pc-${{ hashFiles('sistema/configs/rocola_a4_defconfig') }}-
            rocola-sistema-pc-
            rocola-sistema-
      # Se para SOLA a las 5 h (todo su grupo de procesos) antes del tope del paso: cortada por el tope de GitHub, sus make y cc1 seguian
      # escribiendo en el ccache mientras se guardaba («file changed as we read it») y no se guardaba nada: cada intento empezaba de cero.
      - name: Compilar Rocola OS para cualquier PC
        timeout-minutes: 320
        run: |
          set +e
          setsid sh sistema/compila.sh & P=$!
          ( sleep 18000; echo "Se acabo el tiempo de esta vuelta: se para para guardar lo hecho"; kill -TERM -$P; sleep 60; kill -KILL -$P ) 2>/dev/null & W=$!
          wait $P; r=$?
          kill $W 2>/dev/null
          exit $r
      - name: Que no quede nada compilando
        if: always()
        run: |
          pkill -9 -f 'make|ccache|cc1|ld\.bfd|ninja' 2>/dev/null || true
          sleep 3
      - name: Guardar descargas y ccache (aunque la compilacion se haya cortado)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/rocola-trabajo/descargas
            /home/runner/rocola-trabajo/ccache
          key: rocola-sistema-pc-${{ hashFiles('sistema/configs/rocola_a4_defconfig') }}-${{ github.run_number }}-${{ github.run_attempt }}
      - name: Probar que arranca (entero, sin instrucciones del Piledriver, QEMU lo corre todo)
        run: |
          I=/home/runner/rocola-trabajo/salida-pc/images
          timeout 900 qemu-system-x86_64 -m 2048 -smp 2 -kernel $I/bzImage -append "console=ttyS0 root=PARTUUID=524f4341-01 rootwait panic=-1" \
            -drive file=$I/disk.img,format=raw,if=ide,snapshot=on -display none -serial file:serie.txt -no-reboot &
          Q=$!; sleep 240; kill $Q 2>/dev/null || true
          tail -n 30 serie.txt
          grep -q "Run /sbin/init" serie.txt
          if grep -q "Instalar Rocola OS" $I/efi-part/EFI/BOOT/grub.cfg; then echo "el menu del PC trae el instalador"; exit 1; fi
      - name: Anadir la memoria del PC a la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ github.run_number }}
          I=/home/runner/rocola-trabajo/salida-pc/images
          mkdir -p pub
          gzip -9c $I/disk.img > pub/disk-pc.img.gz
          (cd pub && sha256sum disk-pc.img.gz > disk-pc.img.gz.sha256)
          gh release upload "sistema-$V" pub/disk-pc.img.gz pub/disk-pc.img.gz.sha256 --clobber
