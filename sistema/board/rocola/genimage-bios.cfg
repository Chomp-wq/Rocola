# disk.img: GRUB en el sector de arranque y el sistema en una particion ext4. La firma del disco (0x524f4341, "ROCA") da
# el PARTUUID 524f4341-01 con que arranca el nucleo, sea el disco que sea (memoria USB o SSD).
image disk.img {
	hdimage {
		disk-signature = 0x524f4341
	}

	partition boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
