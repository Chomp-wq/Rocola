# El menu de la memoria USB de Rocola OS. Lo primero (en 5 s, solo): el instalador (rocola-instalar), que busca la musica, la ensena y
# espera ENTER para instalar en el disco de la rocola. Las otras dos prueban Rocola OS desde la memoria sin instalar nada.
set default="0"
set timeout="5"

menuentry "Instalar Rocola OS en la rocola" {
	linux /boot/bzImage root=PARTUUID=524f4341-01 rootwait console=tty1 net.ifnames=0 quiet loglevel=3 rocola.instalar
}
menuentry "Probar Rocola OS sin instalar" {
	linux /boot/bzImage root=PARTUUID=524f4341-01 rootwait console=tty1 net.ifnames=0 quiet loglevel=3
}
menuentry "Probar Rocola OS - prueba de sonido y grafica" {
	linux /boot/bzImage root=PARTUUID=524f4341-01 rootwait console=tty1 net.ifnames=0 quiet loglevel=3 rocola.prueba
}
