[package]
name = "rocola-prueba-tidal"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "RocolaPruebaTidal"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "native-tls-alpn", "http2", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tiny_http = "0.12"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
